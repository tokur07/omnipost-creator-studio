name: Build Android APK (Debug & Release Signed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Generate Android Project
        run: |
          npm install
          npx cap add android
          node scripts/configure-android.js
          npx cap sync android

      - name: Generate Release Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'omnipost2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'omnipost' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'omnipost2026' }}
        run: |
          keytool -genkey -v \
            -keystore android/app/release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=OmniPost Studio, OU=Creator, O=OmniPost, L=Bogor, ST=West Java, C=ID"

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'omnipost2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'omnipost' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'omnipost2026' }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug assembleRelease

      - name: Rename Output APKs
        run: |
          mkdir -p release-outputs
          cp android/app/build/outputs/apk/debug/app-debug.apk release-outputs/OmniPost-Studio-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk release-outputs/OmniPost-Studio-release-signed.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniPost-Creator-Studio-APKs
          path: release-outputs/*.apk
          retention-days: 30

      - name: Publish GitHub Release (Auto Tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OmniPost Creator Studio v1.0.${{ github.run_number }}
          body: |
            Build otomatis **OmniPost Creator Studio** (termasuk integrasi Meta Threads, Auto-Split Utas, dan akses galeri media lokal).
            - **OmniPost-Studio-release-signed.apk**: Instal langsung di perangkat Android.
            - **OmniPost-Studio-debug.apk**: Versi debug.
          files: |
            release-outputs/OmniPost-Studio-release-signed.apk
            release-outputs/OmniPost-Studio-debug.apk
